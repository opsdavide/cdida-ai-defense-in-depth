user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/log/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting: 10 requests per second limit per client IP
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;
    
    # Custom 429 rate limit response code
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        location / {
            # Apply rate limit zone with a burst of 5 (nodelay keeps response fast or drops immediately)
            limit_req zone=api_limit_zone burst=5 nodelay;

            proxy_pass http://ai-api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
